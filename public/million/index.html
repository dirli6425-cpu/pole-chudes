<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070c2a"><title>Миллион для группы — игровая студия</title><style>@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap');
:root{color-scheme:dark;--gold:#f8b85b;--goldLight:#ffe8b3;--blue:#101b5c;--electric:#3062d0}

header{position:relative;z-index:4;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px clamp(16px,3vw,46px);background:linear-gradient(90deg,#03081cdd,#121a4ba0,#03081cdd);border-bottom:1px solid #e3b7776b;box-shadow:0 8px 45px #0008}
header strong{color:#fce2ad;letter-spacing:2.8px;font-weight:900;font-size:clamp(13px,1.6vw,21px);text-shadow:0 0 18px #f0aa4380}nav{display:flex;gap:8px;flex-wrap:wrap}.small{padding:9px 13px;border:1px solid #bfa0688a;border-radius:4px;background:#091139;color:#e9d3a8;font-size:12px;font-weight:800;min-height:39px;box-shadow:inset 0 0 15px #2a51ae30}.small:hover{background:#203b85}
#error{position:relative;z-index:3;color:#ffb8b8;text-align:center;padding:8px}#error:empty{display:none}
main{position:relative;z-index:2;width:min(100%,1560px);margin:auto;padding:clamp(15px,2.8vh,34px) clamp(12px,2vw,34px) 35px}
.intro{max-width:1060px;margin:0 auto;min-height:calc(100svh - 165px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative}
.studio-emblem{width:clamp(170px,24vw,315px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;position:relative;margin:0 auto 20px;background:radial-gradient(circle,#1e307d 0 32%,#080e36 34% 51%,#cba663 52%,#17215d 55%,#080e35 62%,#d0b17d 64%,#0b1546 68%,transparent 69%);box-shadow:0 0 0 2px #e7c68b,0 0 30px #4279ffbb,0 0 95px #214ec0b0,inset 0 0 25px #1d5ae5;animation:emblemGlow 5s ease-in-out infinite alternate}
.studio-emblem:before,.studio-emblem:after{content:'';position:absolute;inset:12%;border-radius:50%;border:2px dashed #b0c6ff99;animation:spin 42s linear infinite}.studio-emblem:after{inset:25%;border:2px solid #f6d39688;animation-direction:reverse}

.intro h1{font-size:clamp(35px,5.3vw,78px);line-height:1.06;max-width:950px;margin:8px 0 16px;font-weight:900;text-transform:uppercase;letter-spacing:-1px;color:#f7f5ff;text-shadow:0 3px 0 #172862,0 0 36px #7797ff77}
.intro p{color:#b8c7ec;font-size:clamp(13px,1.35vw,17px);max-width:650px;line-height:1.6}
.gold{background:linear-gradient(165deg,#fff3ce,#f6c774 45%,#a86d26 100%);border:2px solid #ffebba;border-radius:6px;color:#141a39;font-weight:900;letter-spacing:.5px;padding:14px 24px;min-height:49px;box-shadow:0 4px 0 #5a391e,0 0 26px #e9a95055;transition:transform .2s,filter .2s}.gold:hover{filter:brightness(1.12);transform:translateY(-2px)}.intro .gold{font-size:clamp(17px,2vw,23px);padding:18px 44px;margin-top:24px}
.stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(235px,295px);gap:clamp(12px,2vw,27px);align-items:stretch;min-height:min(750px,calc(100svh - 150px))}
.box{position:relative;background:linear-gradient(145deg,#0d1643e8,#060a26ef 75%);border:1px solid #a88852a6;box-shadow:inset 0 0 65px #132f7a55,0 20px 65px #0009;overflow:hidden}
.play-box{border-radius:5px;display:flex;flex-direction:column;justify-content:flex-end;padding:clamp(16px,2vw,32px)}
.play-box:before{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 65% 45% at 50% 30%,#2559e43d,transparent 90%)}
.play-box>*{position:relative}
.stage-spot{margin:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:150px;gap:10px}
.stage-spot .studio-emblem{width:clamp(90px,13vw,190px);margin:0;opacity:.9}
.stage-spot .emblem-core{font-size:clamp(35px,5vw,75px)}
.stage-spot .eyebrow{font-size:11px}
.question{position:relative;display:flex;align-items:center;justify-content:center;text-align:center;padding:clamp(19px,2.3vw,32px) clamp(23px,3vw,45px);margin:15px 0 22px;min-height:clamp(105px,16vh,168px);background:linear-gradient(90deg,#0b123d,#1b327d 50%,#0b123d);border-top:2px solid #d9b777;border-bottom:2px solid #d9b777;box-shadow:inset 0 0 45px #03091d,0 0 24px #3559b244;font-size:clamp(19px,2.2vw,31px);line-height:1.4;font-weight:800;text-shadow:0 2px 8px #000}
.question:before,.question:after{content:'◆';position:absolute;top:50%;transform:translateY(-50%);color:#f4d28c;font-size:23px;text-shadow:0 0 14px #e6b35c}.question:before{left:4px}.question:after{right:4px}
.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.answer{position:relative;min-width:0;min-height:77px;display:flex;align-items:center;gap:13px;text-align:left;padding:12px clamp(14px,1.8vw,26px);background:linear-gradient(105deg,#09123b,#1b3074 50%,#081137);color:#f8f9ff;border:2px solid #c9a36c;clip-path:polygon(18px 0,calc(100% - 18px) 0,100% 50%,calc(100% - 18px) 100%,18px 100%,0 50%);box-shadow:inset 0 0 22px #4d76cf50;transition:background .25s,filter .25s;font-size:clamp(13px,1.4vw,18px);font-weight:700;overflow-wrap:anywhere}
.answer:hover:not(:disabled){background:linear-gradient(110deg,#14266a,#375ab2,#14266a);filter:brightness(1.13)}.answer:disabled{cursor:default;opacity:.48}.answer-letter{color:#f7b950;font-weight:900;font-size:clamp(18px,2vw,24px);white-space:nowrap}.answer-copy{flex:1}.answer.selected{opacity:1;background:linear-gradient(110deg,#9d5d17,#e8b956,#9d5d17);color:#09102c;animation:blink .5s 3}.answer.selected .answer-letter{color:#1d2443}
.answer.correct{opacity:1!important;background:linear-gradient(100deg,#0b6e46,#17b57a,#0b6e46);color:#fff;animation:blink .45s 3}.answer.wrong{opacity:1!important;background:linear-gradient(100deg,#7c1529,#b93043,#7c1529);color:white}
@keyframes blink{50%{filter:brightness(1.55)}}
.notice{min-height:34px;margin:16px 0 8px;color:#ffe0a2;font-weight:800;font-size:clamp(13px,1.5vw,17px);text-align:center}
.tools{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin-top:12px}.hint{padding:10px 15px;min-height:45px;border:1px solid #bfa069;border-radius:5px;color:#ffdfab;background:linear-gradient(#1b316f,#0a1642);font-size:12px;font-weight:800}.hint:hover:not(:disabled){background:#304d9e}.hint:disabled{opacity:.35;cursor:default}
.ladder-box{border-radius:5px;padding:20px 15px;display:flex;flex-direction:column;justify-content:center;background:linear-gradient(160deg,#101c4b,#050a25)}.ladder-title{text-align:center;margin-bottom:12px}.ladder{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:1px}.ladder li{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:38px;padding:7px 12px;color:#e6bc75;font-size:clamp(12px,1.2vw,15px);font-weight:800;border-bottom:1px solid #7189c524}.ladder li.milestone{color:#fff0c5}.ladder li.active{color:#17122c;background:linear-gradient(90deg,#bb7c31,#ffe3a1,#bb7c31);border-radius:4px;box-shadow:0 0 22px #e4a651a8}.ladder-num{font-size:12px;color:#93a6d6}.ladder li.active .ladder-num{color:#31203d}
.editor{max-width:1060px;margin:auto;padding:clamp(17px,3vw,35px);border-radius:12px;user-select:text}.editor *{user-select:text}.editor h2{margin:5px 0 20px;color:#ffdc9d}.editor>label{display:block;color:#f5d7a1}.editor #gameTitle{width:100%;padding:13px;margin-top:7px}.edititem{background:#0c1838;border:1px solid #7c92c6;border-radius:9px;padding:17px;margin:14px 0}.edititem label{display:block;margin:10px 0;color:#f7dca2;font-size:14px}.edititem input,.editor #gameTitle{border-radius:5px;border:1px solid #647eb6;background:#060e28;color:#fff;font-size:16px;user-select:text}.edititem input{width:100%;padding:12px;margin-top:5px}.edititem .options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px 15px}.edititem select{background:#142a50;color:white;padding:10px;border:1px solid #a88851;border-radius:5px}.edititem button{margin-top:10px}
@media(max-width:950px){.stage{grid-template-columns:minmax(0,1fr) 205px}.ladder-box{padding:15px 9px}.ladder li{padding:6px;font-size:12px}.stage-spot{min-height:100px}}
@media(max-width:730px){header{padding:12px 10px}header strong{font-size:13px;letter-spacing:1px}.small{font-size:11px;padding:8px}.stage{grid-template-columns:1fr;min-height:0}.play-box{padding:14px 9px}.stage-spot{min-height:110px}.stage-spot .studio-emblem{width:95px}.question{font-size:clamp(17px,4.6vw,24px);min-height:100px;padding:17px 21px}.answers{grid-template-columns:1fr;gap:9px}.answer{min-height:58px;font-size:15px;padding:11px 21px}.ladder-box{order:2}.ladder{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px}.ladder li{font-size:11px;padding:7px 5px;min-height:34px}.ladder-num{font-size:10px}.edititem .options{grid-template-columns:1fr}main{padding:13px 8px}.intro{min-height:calc(100svh - 145px)}.intro h1{font-size:clamp(32px,9vw,57px)}.tools .hint{flex:1 1 115px}.tools .gold{flex:1 1 170px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head><body>
<header><strong>✦ МИЛЛИОН ДЛЯ ГРУППЫ</strong><nav><a class="small" href="/">← Игры</a><button class="small" id="editButton">⚙ Вопросы</button><button class="small" id="soundButton">♫ Звук вкл.</button><button class="small" id="fullButton">⛶ Экран</button></nav></header><div id="error"></div>
<main>
<section id="intro" class="intro"><div class="studio-emblem"><div class="emblem-core">М</div></div><div class="eyebrow">Интеллектуальное шоу</div><h1 id="introTitle">Миллион для группы</h1><p>15 вопросов · 4 варианта ответа · 3 подсказки. Кто дойдёт до миллиона?</p><button class="gold" id="startButton">▶ НАЧАТЬ ИГРУ</button></section>
<section id="play" class="stage hidden"><div class="box play-box"><div class="stage-spot"><div class="studio-emblem"><div class="emblem-core">М</div></div><div class="eyebrow" id="roundText">ВОПРОС 1</div></div><div class="question" id="question"></div><div class="answers" id="answers"></div><div class="notice" id="notice" aria-live="polite"></div><div class="tools"><button class="hint" id="fifty">◑ 50 / 50</button><button class="hint" id="audience">♟ Помощь зала</button><button class="hint" id="swap">⇄ Замена вопроса</button><button class="gold hidden" id="next">Следующий вопрос →</button><button class="hint" id="restart">↻ Заново</button></div></div><aside class="box ladder-box"><div class="eyebrow ladder-title">✦ ПРИЗОВАЯ ЛЕСТНИЦА ✦</div><ol class="ladder" id="ladder"></ol></aside></section>
<section id="editor" class="box editor hidden"><h2>⚙ Редактор игры</h2><label>Название игры <input id="gameTitle" maxlength="100"></label><div id="questionList"></div><div class="tools"><button class="hint" id="add">+ Добавить вопрос</button><button class="gold" id="save">💾 Сохранить в D1</button><button class="hint" id="cancel">← Вернуться</button></div><p style="color:#bdc9e1;font-size:13px">Авторизация общая с «Полем чудес» и запоминается на 90 дней.</p></section>
</main><script>
'use strict';const $=id=>document.getElementById(id);let config={title:'Миллион для группы',questions:[]},index=0,finished=false,used={fifty:false,audience:false,swap:false},removed=[],locked=false;const money=['100','200','300','500','1 000','2 000','4 000','8 000','16 000','32 000','64 000','125 000','250 000','500 000','1 000 000'];const letters=['А','Б','В','Г'];function show(id){for(const n of ['intro','play','editor'])$(n).classList.toggle('hidden',n!==id)}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function load(){try{const r=await fetch('/api/million',{cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.error||'Ошибка сервера');config=d;$('introTitle').textContent=config.title;render()}catch(e){$('error').textContent='⚠ '+e.message+' — проверьте миграцию D1'}}function render(){const q=config.questions[index];if(!q)return;$('roundText').textContent='ВОПРОС '+(index+1)+' / '+config.questions.length+' · '+money[Math.min(index,14)]+' ОЧКОВ';$('question').textContent=q.q;$('answers').innerHTML='';q.options.forEach((answer,i)=>{const b=document.createElement('button');b.className='answer';b.innerHTML='<span class="answer-letter">'+letters[i]+':</span><span class="answer-copy"></span>';b.querySelector('.answer-copy').textContent=answer;b.disabled=locked||removed.includes(i);b.onclick=()=>choose(i);$('answers').append(b)});$('ladder').innerHTML='';for(let i=Math.min(15,config.questions.length)-1;i>=0;i--){const li=document.createElement('li');if(i===index)li.className='active';li.innerHTML='<span class="ladder-num">'+String(i+1).padStart(2,'0')+'</span><span>'+money[Math.min(i,14)]+'</span>';if([4,9,14].includes(i))li.classList.add('milestone');$('ladder').append(li)}$('fifty').disabled=used.fifty||locked;$('audience').disabled=used.audience||locked;$('swap').disabled=used.swap||locked||index>=config.questions.length-1;$('next').classList.toggle('hidden',!finished)}function choose(i){
 if(locked)return;locked=true;finished=false;
 const q=config.questions[index],buttons=[...$('answers').children];
 buttons.forEach((b,j)=>{b.disabled=true;if(j===i)b.classList.add('selected')});
 $('notice').textContent='Ответ '+letters[i]+' принят. И это...';
 $('next').classList.add('hidden');
 sound('suspense');
 setTimeout(()=>{
  buttons.forEach((b,j)=>{if(j===q.correct)b.classList.add('correct');if(j===i&&i!==q.correct)b.classList.add('wrong')});
  const right=i===q.correct;
  $('notice').textContent=right?'✦ ВЕРНО! '+money[Math.min(index,14)]+' очков!':'✕ НЕВЕРНО! Правильный ответ: '+letters[q.correct];
  sound(right?'correct':'wrong');finished=true;
  $('next').textContent=right?(index+1<config.questions.length?'Следующий вопрос →':'Завершить игру'):'Завершить игру';
  $('next').classList.remove('hidden');$('next').dataset.lost=right?'0':'1';
 },1650);
}
$('startButton').onclick=()=>{sound('start');$('next').dataset.lost='0';if(!config.questions.length){alert('Сначала добавьте вопросы в настройках');return}index=0;used={fifty:false,audience:false,swap:false};removed=[];locked=false;finished=false;$('notice').textContent='';render();show('play')};$('next').onclick=()=>{if($('next').dataset.lost==='1'){show('intro');$('introTitle').textContent='Игра окончена';$('next').dataset.lost='0';return}if(index+1>=config.questions.length){show('intro');$('introTitle').textContent='Игра завершена!';return}index++;locked=false;finished=false;removed=[];$('notice').textContent='';render()};$('restart').onclick=()=>{if(confirm('Начать игру заново?'))$('startButton').click()};$('fifty').onclick=()=>{sound('click');used.fifty=true;const q=config.questions[index];removed=[0,1,2,3].filter(i=>i!==q.correct).sort(()=>Math.random()-.5).slice(0,2);render()};$('audience').onclick=()=>{sound('click');used.audience=true;const q=config.questions[index];const guess=Math.floor(65+Math.random()*25);$('notice').textContent='📊 Мнение зала (демо): '+letters[q.correct]+' — '+guess+'% голосов';render()};$('swap').onclick=()=>{sound('click');used.swap=true;index++;removed=[];locked=false;finished=false;$('notice').textContent='Вопрос заменён';render()};$('fullButton').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};function editRow(q,i){const el=document.createElement('div');el.className='edititem';el.innerHTML='<strong>Вопрос '+(i+1)+'</strong><label>Текст вопроса<input class="q" maxlength="500" value="'+escapeHtml(q.q)+'"></label><div class="options">'+q.options.map((a,j)=>'<label>Вариант '+letters[j]+'<input class="opt" maxlength="200" value="'+escapeHtml(a)+'"></label>').join('')+'</div><label>Правильный вариант <select class="correct">'+letters.map((l,j)=>'<option value="'+j+'" '+(j===q.correct?'selected':'')+'>'+l+'</option>').join('')+'</select></label><button class="hint delete">Удалить вопрос</button>';el.querySelector('.delete').onclick=()=>{el.remove();renumber()};return el}function renumber(){[...$('questionList').children].forEach((el,i)=>el.querySelector('strong').textContent='Вопрос '+(i+1))}function openEditor(){$('gameTitle').value=config.title;$('questionList').innerHTML='';config.questions.forEach((q,i)=>$('questionList').append(editRow(q,i)));show('editor')}$('editButton').onclick=openEditor;$('cancel').onclick=()=>show('intro');$('add').onclick=()=>{if($('questionList').children.length>=50)return alert('Максимум 50 вопросов');$('questionList').append(editRow({q:'',options:['','','',''],correct:0},$('questionList').children.length))};async function auth(){const r=await fetch('/api/auth',{cache:'no-store'});if(r.ok&&(await r.json()).authenticated)return true;const password=prompt('Введите пароль администратора (один раз на 90 дней):');if(!password)return false;const p=await fetch('/api/auth',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password})});const d=await p.json();if(!p.ok)throw Error(d.error||'Ошибка входа');return true}$('save').onclick=async()=>{const qs=[...$('questionList').children].map(el=>({q:el.querySelector('.q').value.trim(),options:[...el.querySelectorAll('.opt')].map(x=>x.value.trim()),correct:Number(el.querySelector('.correct').value)}));const data={title:$('gameTitle').value.trim(),questions:qs};if(!data.title||!qs.length||qs.some(q=>!q.q||q.options.some(a=>!a)))return alert('Заполните название, вопросы и все 4 ответа');try{if(!await auth())return;const r=await fetch('/api/million',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify(data)});const d=await r.json();if(!r.ok)throw Error(d.error||'Ошибка сохранения');config=data;$('introTitle').textContent=data.title;show('intro');alert('✓ Вопросы сохранены в Cloudflare D1')}catch(e){alert('Ошибка: '+e.message)}};load();

let audioCtx;let muted=false;
function sound(type){if(muted)return;try{
 audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
 if(audioCtx.state==='suspended')audioCtx.resume();
 const t=audioCtx.currentTime;
 const notes={click:[[440,0,.09]],start:[[220,0,.12],[330,.14,.12],[440,.3,.22]],suspense:[[196,0,.22],[220,.29,.22],[247,.59,.35]],correct:[[392,0,.14],[494,.16,.14],[587,.32,.18],[784,.53,.35]],wrong:[[260,0,.18],[220,.22,.24],[164,.49,.45]]}[type]||[];
 notes.forEach(([freq,offset,duration])=>{const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type=type==='wrong'?'sawtooth':'sine';osc.frequency.setValueAtTime(freq,t+offset);gain.gain.setValueAtTime(.0001,t+offset);gain.gain.exponentialRampToValueAtTime(type==='wrong'?.055:.095,t+offset+.025);gain.gain.exponentialRampToValueAtTime(.0001,t+offset+duration);osc.connect(gain).connect(audioCtx.destination);osc.start(t+offset);osc.stop(t+offset+duration+.03)});
}catch(e){}}
$('soundButton').onclick=()=>{muted=!muted;$('soundButton').textContent=muted?'🔇 Звук выкл.':'♫ Звук вкл.';if(!muted)sound('click')};
</script></body></html>
